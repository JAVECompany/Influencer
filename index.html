<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fa" />
    <script>
      const rootTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = rootTheme
      try {
        const storedTheme = JSON.parse(localStorage.getItem('bamgyeol-theme-v1'))?.state?.theme
        const palettes = ['dark', 'light', 'orbit', 'liquid-glass', 'periwinkle', 'peach', 'mocha']
        if (palettes.includes(storedTheme)) {
          document.documentElement.dataset.theme = storedTheme
        }
      } catch {
        // The system theme is already applied when storage is unavailable.
      }
    </script>
    <meta name="description" content="밤결 · 구독으로 이어지는 크리에이터의 이야기" />
    <link rel="icon" type="image/png" href="/brand/logos/light.png" />
    <title>밤결 — 구독으로 이어지는 이야기</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
